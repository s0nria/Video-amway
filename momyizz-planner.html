<style>
/* Layout: one calm column (max 720px), sticky brand bar on top, thumb-reach tab bar at the bottom. MUJI-inspired: paper, sage, linen, wood. */
:root{
  --bg:#F2EEE5; --paper:#FBF9F4; --ink:#35362F; --muted:#77756A; --line:#E0D9CB;
  --sage:#7F9373; --sage-deep:#556A4C; --sage-soft:#E2E8D9; --linen:#EAE1D0; --wood:#A3876A; --wood-soft:#F0E6D8;
  --p-hw:#5C7A58; --p-mp:#557F7A; --p-lf:#9E7F5C; --p-bp:#AE8578;
  --st-0:#9A968A; --st-1:#B8954A; --st-2:#7F9373; --st-3:#45603F;
  --ok:#4E7347; --warn:#B07C3A; --bad:#A65B4B;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1D19; --paper:#272722; --ink:#ECE8DD; --muted:#A8A496; --line:#3A3931;
  --sage:#95AA88; --sage-deep:#B4C8A6; --sage-soft:#323A2D; --linen:#353128; --wood:#C3A585; --wood-soft:#3A3229;
  --p-hw:#8DB287; --p-mp:#86B3AD; --p-lf:#CDAA82; --p-bp:#D4A797;
  --st-0:#8E8A7E; --st-1:#D2AE62; --st-2:#95AA88; --st-3:#A9CB9D;
  --ok:#93BE89; --warn:#D7A35E; --bad:#D98C7B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1D19; --paper:#272722; --ink:#ECE8DD; --muted:#A8A496; --line:#3A3931;
  --sage:#95AA88; --sage-deep:#B4C8A6; --sage-soft:#323A2D; --linen:#353128; --wood:#C3A585; --wood-soft:#3A3229;
  --p-hw:#8DB287; --p-mp:#86B3AD; --p-lf:#CDAA82; --p-bp:#D4A797;
  --st-0:#8E8A7E; --st-1:#D2AE62; --st-2:#95AA88; --st-3:#A9CB9D;
  --ok:#93BE89; --warn:#D7A35E; --bad:#D98C7B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage-deep);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{flex:1;min-width:0}
.brand b{font-family:var(--f-display);letter-spacing:.22em;font-size:17px;display:block}
.brand small{color:var(--muted);font-size:12px;display:block;line-height:1.3}
.save{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--st-0);display:inline-block}
.save[data-s="cloud"] i{background:var(--ok)} .save[data-s="local"] i{background:var(--warn)} .save[data-s="saving"] i{background:var(--st-1)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;padding:0 12px;font-size:13px}

/* main */
main{max-width:720px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section.view{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--linen);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .3s}
.bar.big{height:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st0{color:var(--st-0)} .st1{color:var(--st-1)} .st2{color:var(--st-2)} .st3{color:var(--st-3)}
.pl{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;color:var(--paper);white-space:nowrap}
.pl-hw{background:var(--p-hw)} .pl-mp{background:var(--p-mp)} .pl-lf{background:var(--p-lf)} .pl-bp{background:var(--p-bp)}
.ev{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px;border:1px solid}
.ev-bukti{color:var(--ok)} .ev-awal{color:var(--warn)} .ev-kajian{color:var(--p-mp)} .ev-belum{color:var(--bad)} .ev-info{color:var(--muted)}

/* next episode */
.next{background:var(--sage-soft);border:1px solid transparent;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.next h3{font-size:19px}
.btn{border:1px solid var(--sage-deep);background:var(--sage-deep);color:var(--paper);border-radius:10px;min-height:44px;padding:0 16px;font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--sage-deep)}
.btn.warn{background:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* lists */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tasks li:first-child{border-top:0}
.chk{display:flex;align-items:center;gap:12px;min-height:46px;padding:4px 0;cursor:pointer;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;border:1.5px solid var(--wood);border-radius:7px;background:var(--paper);display:grid;place-items:center;margin:0;cursor:pointer}
.chk input:checked{background:var(--sage-deep);border-color:var(--sage-deep)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked + span{color:var(--muted);text-decoration:line-through}
.chk span{flex:1}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 6px;min-height:76px;display:flex;flex-direction:column;gap:3px;text-align:left;font-size:11px;line-height:1.3;min-width:0}
.day b{font-family:var(--f-display);font-size:16px}
.day .dw{color:var(--muted)}
.day.main{border-width:2px}
.day.main.hw{border-color:var(--p-hw)} .day.main.mp{border-color:var(--p-mp)} .day.main.lf{border-color:var(--p-lf)} .day.main.bp{border-color:var(--p-bp)}
.day .tag{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.today{background:var(--sage-soft)}
.day .dots{margin-top:auto;height:4px;border-radius:2px;background:var(--linen);overflow:hidden}
.day .dots i{display:block;height:100%;background:var(--sage)}
.legend{display:flex;gap:8px;flex-wrap:wrap}

/* episode list */
.eplist{display:flex;flex-direction:column;gap:10px}
.ep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.ep .no{font-family:var(--f-display);font-size:24px;color:var(--wood);line-height:1}
.ep h3{font-size:16px;margin:4px 0 6px}
.ep .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}

/* detail */
.back{background:none;border:0;color:var(--sage-deep);font-weight:600;padding:8px 0;min-height:40px;text-align:left}
details.fld{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
details.fld > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;min-height:48px}
details.fld > summary::-webkit-details-marker{display:none}
details.fld > summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:18px;font-weight:400}
details.fld[open] > summary::after{content:"–"}
details.fld > summary .k{font-family:var(--f-display);color:var(--wood);font-size:12px;width:20px}
.fbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
textarea,input[type=text],input[type=url],input[type=date],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.lb{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{font-size:14px}
.src{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
.src a{color:var(--sage-deep);overflow-wrap:anywhere}
.sb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sb li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.sb li:first-child{border-top:0}
.sb .t{font-family:var(--f-display);color:var(--wood);font-size:12px;padding-top:2px}
.copy{align-self:flex-start}
.thread{border-left:3px solid var(--linen);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.notice{background:var(--wood-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.rslot{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-height:48px}
.rslot input[type=checkbox]{width:22px;height:22px;accent-color:var(--sage-deep);flex:none}
.rslot b{font-variant-numeric:tabular-nums}
.rslot.late{border-color:var(--bad);color:var(--bad)}
.rslot.ok{opacity:.65}
.rslot.ok span{text-decoration:line-through}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:99px;min-height:36px;padding:0 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--paper)}

/* daily */
details.dd{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
details.dd > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px}
details.dd > summary::-webkit-details-marker{display:none}
details.dd.today{border-color:var(--sage-deep);border-width:2px}
.dd .dn{font-family:var(--f-display);font-size:20px;line-height:1;color:var(--wood)}
.dd .dn small{display:block;font-size:10px;color:var(--muted);font-family:var(--f-body);margin-top:3px}
.dd .ttl{font-size:13px;min-width:0}
.dd .ttl b{display:block;font-size:14px}
.ring{font-size:12px;font-weight:700;color:var(--muted)}
.ring.done{color:var(--ok)}

/* perf */
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.prow:first-child{border-top:0}
.prow .nums{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px}
.hbar{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:12px;padding:4px 0}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .v{text-align:right}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formgrid .full{grid-column:1/-1}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-size:14px}

/* ideas */
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--line)}
.idea:first-child{border-top:0}
.idea p{margin:0;font-size:14px}
.idea.used p{color:var(--muted);text-decoration:line-through}
.idea .acts{display:flex;gap:6px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
nav.tabs button{background:none;border:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 2px}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--sage-deep);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.footer-motto{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.06em;padding-top:8px}
@media (min-width:560px){.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.cal{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><b>MOMYIZZ</b><small>Your Health &amp; Beauty Buddy is Here!</small></div>
  <div class="save" id="saveState" data-s="init"><i></i><span>Memuatkan…</span></div>
  <button class="iconbtn" id="openBackup" type="button">Backup</button>
</div></header>

<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

{n:2,p:"hw",hookType:"Situasi harian",format:"Video pendek",
title:"Sarapan Ibu Yang Selalu Tertinggal",
audience:"Ibu bekerja dan suri rumah yang kelam-kabut waktu pagi.",
problem:"Anak dah makan, suami dah makan, tapi ibu cuma minum kopi manis dan tunggu \"nanti\". Akhirnya lapar sangat tengah hari dan makan apa saja yang ada.",
hook:"Anak dah makan, suami dah makan… ibu? \"Nanti la.\" Siapa macam ni?",
story:"7.15 pagi. Kak Ana sapu jem atas roti anak, ikat rambut si kecil, tuang kopi untuk diri sendiri.\n\n11 pagi, dalam mesyuarat, perut berbunyi. Kepala rasa berat. Dia capai biskut dalam laci.\n\nPetang balik rumah, lapar sangat. Makan banyak sekali gus.\n\nKitaran ni berulang setiap hari. Bukan sebab Kak Ana tak tahu nak jaga makan. Tapi sebab dia selalu letak diri sendiri paling akhir.",
facts:[
 {l:"bukti",t:"Pinggan Sihat Malaysia (KKM): separuh pinggan sayur dan buah, suku bijirin (utamakan bijirin penuh), suku protein seperti ikan, ayam, telur atau kekacang.",s:"KKM MDG 2020"},
 {l:"bukti",t:"Garis Panduan Diet Malaysia menggalakkan pengambilan pelbagai jenis makanan setiap hari dan mengehadkan gula tambahan, termasuk dalam minuman.",s:"KKM MDG 2020"},
 {l:"info",t:"Sarapan tak perlu mewah. Gabungan protein, karbohidrat kompleks dan serat membantu kita rasa kenyang lebih lama berbanding minuman manis sahaja.",s:"Panduan pemakanan umum"}
],
solution:"\"Sarapan 5 Minit Ibu\":\n• Telur rebus (rebus malam sebelumnya) + roti gandum penuh + pisang\n• Oat rendam semalaman dengan susu dan buah\n• Siapkan \"bekal ibu\" sekali dengan bekal anak\n• Minum segelas air kosong dulu sebelum kopi",
product:"Nutrilite Soy Protein Drink. Pilihan tambahan untuk hari yang benar-benar kelam-kabut, BUKAN pengganti sarapan sebenar.",
productFacts:"Tersenarai di amway.my sebagai \"Nutrilite Soy Protein Drink\" (perisa Mixed Berries 500g dan Green Tea 450g, semakan 11 Nov 2026).\nPERLU SEMAK sebelum post: kandungan protein setiap hidangan, ramuan dan cara pengambilan pada label atau halaman produk rasmi. Jangan tulis angka yang belum disahkan.",
sources:["mdg","amway"],
visual:"Pinggan Sihat atas meja kayu cerah, cahaya pagi. Split screen: ibu berdiri tergesa-gesa vs ibu duduk 5 minit menikmati sarapan.",
prompt:"Overhead shot of a balanced Malaysian breakfast plate, boiled eggs, wholegrain toast, banana slices, papaya, glass of water, light wood table, soft morning light, sage and cream tones, minimalist MUJI aesthetic, 4:5",
storyboard:[["0–3s","Ibu tergesa-gesa: ikat rambut anak, kopi di tangan. Teks: \"Ibu? Nanti la…\""],["3–12s","Jam 11 pagi: ibu letih, capai biskut di pejabat."],["12–25s","Grafik Pinggan Sihat Malaysia: ½ sayur & buah, ¼ bijirin, ¼ protein."],["25–40s","Montaj 3 idea sarapan 5 minit."],["40–45s","Ibu duduk dan makan. Teks: \"Ibu pun perlu diisi.\""]],
fb:"\"Anak dah makan? Dah. Suami? Dah. Ibu?\"\n\"Nanti la…\" ☕\n\nSiapa yang setiap pagi macam ni?\n\nMomyizz kenal ramai ibu yang jaga makan seisi rumah dengan teliti, tapi diri sendiri cuma minum kopi manis sampai tengah hari. Pukul 11 dah mula pening, capai biskut. Balik petang lapar sangat, makan banyak sekali gus.\n\nBukan sebab kita tak tahu. Kita cuma selalu letak diri sendiri paling akhir.\n\nKKM ada panduan mudah, Pinggan Sihat Malaysia:\n🥦 Separuh pinggan sayur & buah\n🍞 Suku bijirin, utamakan bijirin penuh\n🥚 Suku protein: ikan, ayam, telur, kekacang\n\nSarapan tak perlu mewah. Ini idea \"Sarapan 5 Minit Ibu\":\n✅ Telur rebus (siapkan malam sebelumnya) + roti gandum + pisang\n✅ Oat rendam semalaman dengan susu & buah\n✅ Bila siapkan bekal anak, siapkan satu untuk ibu juga\n\nKalau hari tu memang huru-hara sangat, ada yang ambil minuman protein sebagai tambahan. Tapi makanan sebenar tetap nombor satu ya.\n\nIbu yang cukup tenaga, rumah pun lebih tenang. 💚\n\nSumber: KKM, Garis Panduan Diet Malaysia 2020.",
threads:["Pagi tadi Momyizz perasan: semua orang dalam rumah dah sarapan, kecuali Momyizz. 🙃\n\nIbu-ibu, kita selalu letak diri sendiri paling akhir kan?","Panduan KKM senang je: separuh pinggan sayur & buah, suku bijirin, suku protein.\n\nSarapan 5 minit pun boleh: telur rebus + roti gandum + pisang.","Esok cuba siapkan satu bekal untuk diri sendiri juga.\n\nApa menu sarapan paling laju korang? Kongsi, Momyizz nak curi idea. 👇"],
cta:"Kongsi menu sarapan 5 minit korang di ruangan komen. Momyizz akan kumpul jadi satu senarai untuk semua ibu.",
hashtags:TAGS+" #PingganSihatMalaysia #SarapanSihat #IbuBekerja #PemakananSeimbang #NutrisiKeluarga"},

{n:3,p:"lf",hookType:"Fakta mengejut",format:"Video pendek",
title:"Span Dapur: Penjaga Kebersihan Atau Sarang Kuman?",
audience:"Suri rumah dan ibu yang mengurus dapur setiap hari.",
problem:"Span basuh pinggan dipakai berminggu-minggu sampai hancur. Kita rasa ia bersih sebab sentiasa bersabun.",
hook:"Benda dalam dapur yang kita pegang setiap hari, tapi paling jarang kita tukar… span basuh pinggan.",
story:"Malam lepas makan, Momyizz basuh pinggan macam biasa. Span kuning-hijau tu dah tiga minggu. Dah nipis, ada bau masam sikit.\n\n\"Eh, tak apa la, dia kan sentiasa kena sabun.\"\n\nRupanya span yang sentiasa lembap, hangat dan ada sisa makanan ialah tempat yang sangat selesa untuk bakteria membiak. Barang yang kita guna untuk 'membersihkan' boleh jadi barang yang paling perlu dibersihkan.",
facts:[
 {l:"bukti",t:"Kajian Cardinale et al. (2017, Scientific Reports) menemui kepadatan bakteria yang sangat tinggi dalam span dapur terpakai yang dikutip dari rumah.",s:"Cardinale 2017"},
 {l:"awal",t:"Dalam kajian yang sama, span yang selalu 'dibersihkan' dengan kaedah rumah tidak semestinya kurang bakteria. Penulis mencadangkan span ditukar secara berkala, contohnya setiap minggu.",s:"Cardinale 2017"},
 {l:"bukti",t:"WHO '5 Kunci Makanan Lebih Selamat': jaga kebersihan, asingkan makanan mentah dan masak, masak sempurna, simpan pada suhu selamat, guna air dan bahan mentah yang selamat.",s:"WHO 2006"}
],
solution:"Rutin dapur yang mudah:\n• Tukar span secara berkala (tanda tarikh dengan pen marker)\n• Perah dan biarkan span kering selepas guna, jangan rendam dalam sinki\n• Kain lap meja dan kain lap pinggan diasingkan, basuh selalu\n• Asingkan papan pemotong daging mentah dan sayur\n• Basuh tangan sebelum dan selepas sentuh bahan mentah",
product:"AMWAY HOME DISH DROPS. Sabun pencuci pinggan pekat sebagai sebahagian rutin dapur. Tekankan: sabun yang baik tidak menggantikan amalan tukar span dan keringkan span.",
productFacts:"Tersenarai di amway.my sebagai \"DISH DROPS Concentrated Dishwashing Liquid - 1L\" di bawah Amway Home (semakan 11 Nov 2026).\nPERLU SEMAK sebelum post: nisbah cairan, ciri formula dan sebarang dakwaan mesra alam pada halaman produk rasmi.",
sources:["sponge","fivekeys","amway"],
visual:"Sinki dapur bersih, span lama di sebelah span baharu dengan tarikh ditulis. Rak pengering span. Tona putih, sage dan kayu.",
prompt:"Clean minimalist kitchen sink, worn old sponge next to a fresh new sponge with a date written on masking tape, wooden dish rack, soft daylight, white sage and oak tones, Japanese minimalist home, 4:5",
storyboard:[["0–3s","Close-up span lama diperah. Teks: \"Bila kali terakhir korang tukar ni?\""],["3–12s","Momyizz: \"Span ni sentiasa basah, hangat, ada sisa makanan…\""],["12–25s","Teks fakta: Kajian 2017 jumpa bakteria sangat padat dalam span terpakai."],["25–42s","Demo rutin: tanda tarikh, perah, keringkan, asingkan papan pemotong."],["42–48s","Dapur kemas. Teks: \"Dapur bersih bermula dengan benda kecil.\""]],
fb:"Benda yang kita pegang setiap hari di dapur, tapi paling jarang kita tukar…\n\nSpan basuh pinggan. 🧽\n\nMomyizz pun pernah guna satu span sampai tiga minggu. Dah nipis, bau masam sikit. Fikir Momyizz, \"Tak apa, dia kan sentiasa bersabun.\"\n\nRupanya satu kajian di Jerman (Scientific Reports, 2017) jumpa bakteria yang sangat padat dalam span dapur terpakai. Span yang selalu basah, hangat dan ada sisa makanan memang tempat yang selesa untuk bakteria.\n\nYang menarik, span yang selalu \"dibersihkan\" dengan cara biasa di rumah pun tak semestinya kurang bakteria. Penyelidik cadangkan kita tukar span secara berkala, contohnya seminggu sekali.\n\nRutin dapur yang Momyizz amalkan sekarang:\n✅ Tulis tarikh pada span baru (pen marker pun jadi)\n✅ Perah & biar kering lepas guna, jangan rendam dalam sinki\n✅ Kain lap meja & kain lap pinggan diasingkan\n✅ Papan pemotong daging mentah & sayur diasingkan\n✅ Basuh tangan sebelum & selepas pegang bahan mentah\n\nSabun pencuci pinggan pekat memang membantu kerja basuh lebih jimat. Tapi sabun sebagus mana pun tak menggantikan tabiat tukar span tu ya. 😉\n\nBila kali terakhir korang tukar span? Jujur je kat komen. 😂\n\nSumber: Cardinale et al., Scientific Reports (2017); WHO, Five Keys to Safer Food.",
threads:["Soalan jujur: bila kali terakhir korang tukar span basuh pinggan? 🧽","Kajian 2017 jumpa bakteria sangat padat dalam span dapur terpakai. Sentiasa basah + hangat + sisa makanan = tempat selesa untuk bakteria.\n\nPenyelidik cadang tukar secara berkala, contohnya seminggu sekali.","Tip Momyizz: tulis tarikh pada span baru, perah dan keringkan lepas guna.\n\nSiapa nak sambung dengan tip kebersihan dapur lain?"],
cta:"Komen tarikh kali terakhir korang tukar span. Tag kawan yang perlu tengok video ni. 😄",
hashtags:TAGS+" #KebersihanDapur #TipsRumah #SuriRumah #DapurSihat #AmwayHome"},

{n:4,p:"mp",hookType:"Situasi harian",format:"Video pendek",
title:"Panaskan Lauk Dalam Bekas Plastik?",
audience:"Wanita bekerja yang bawa bekal dan ibu yang memanaskan lauk untuk anak.",
problem:"Bekal dalam bekas plastik terus masuk microwave pejabat. Lauk semalam dipanaskan dalam bekas yang sama setiap hari.",
hook:"Bekal dalam bekas plastik, terus \"ting!\" dalam microwave pejabat. Biasa buat?",
story:"Pukul 1 tengah hari. Beratur depan microwave pejabat. Semua bekas plastik pelbagai warna. Ada yang dah kekuningan, ada yang dah berbau kari.\n\nMomyizz tengok bekas sendiri. Penutupnya dah melengkung sebab selalu kena panas.\n\nSatu soalan muncul: plastik yang selalu kena panas ni, apa yang jadi pada dia? Dan apa kata kajian?",
facts:[
 {l:"awal",t:"Hussain et al. (2023): dalam ujian makmal, memanaskan bekas makanan plastik dalam microwave membebaskan jauh lebih banyak zarah mikro dan nanoplastik berbanding penyimpanan biasa.",s:"Hussain 2023"},
 {l:"kajian",t:"Kesan zarah ini kepada kesihatan manusia masih dikaji. Ujian sel di makmal tidak sama dengan keadaan sebenar dalam badan manusia.",s:"WHO 2022"},
 {l:"belum",t:"FDA menyatakan bukti saintifik semasa belum menunjukkan mikroplastik atau nanoplastik dalam makanan menimbulkan risiko kesihatan kepada manusia, dan pemantauan diteruskan.",s:"FDA"},
 {l:"info",t:"Label 'microwave safe' bermaksud bekas itu direka untuk kegunaan tersebut. Ikut arahan pengeluar dan tukar bekas yang sudah rosak.",s:"Panduan umum"}
],
solution:"Langkah mudah tanpa perlu buang semua bekas:\n• Pindahkan lauk ke pinggan kaca atau seramik sebelum panaskan\n• Tukar bekas yang dah retak, melengkung atau kusam\n• Biar lauk sejuk sedikit sebelum masuk ke bekas plastik\n• Bila beli bekas baru, pertimbangkan kaca atau keluli tahan karat untuk bekal",
product:"Tiada. Alternatif yang dicadangkan ialah bekas kaca atau seramik biasa. Jangan kaitkan dengan mana-mana produk.",
productFacts:"Tidak berkaitan.",
sources:["hussain","fda","who22"],
visual:"Barisan bekas plastik di pantri pejabat vs satu mangkuk kaca berisi nasi dan lauk. Teks: \"Pindah dulu, baru panaskan.\"",
prompt:"Office pantry counter with several colorful worn plastic lunch boxes, one glass bowl with Malaysian rice and curry being placed in a microwave, natural light, muted beige and sage tones, documentary style, 9:16",
storyboard:[["0–3s","Bunyi \"ting!\" microwave. Teks: \"Biasa buat?\""],["3–12s","Close-up penutup bekas yang melengkung dan berwarna kuning."],["12–26s","Teks: Kajian makmal 2023: panaskan bekas plastik dalam microwave lepaskan lebih banyak zarah. Label: KAJIAN AWAL."],["26–34s","Teks: FDA: bukti risiko kepada manusia belum ditunjukkan. Kajian diteruskan."],["34–50s","Demo: pindah lauk ke mangkuk kaca, panaskan. Teks: \"Langkah kecil, kurang pendedahan.\""]],
fb:"Pukul 1 tengah hari. Beratur depan microwave pejabat. 🍱\n\nSemua orang pegang bekas plastik. Ada yang dah kekuningan, ada yang penutupnya dah melengkung macam bekas Momyizz.\n\nPernah terfikir apa jadi pada plastik yang selalu kena panas?\n\nSatu kajian makmal (Environmental Science & Technology, 2023) dapati bila bekas makanan plastik dipanaskan dalam microwave, lebih banyak zarah mikro dan nanoplastik dilepaskan berbanding penyimpanan biasa.\n\nTapi penting untuk faham:\n🔸 Ini KAJIAN AWAL dalam makmal\n🔸 Kesan pada kesihatan manusia masih dikaji\n🔸 FDA kata bukti semasa belum tunjuk risiko kesihatan kepada manusia\n\nJadi kita tak perlu panik. Tapi bila ada cara mudah untuk kurangkan pendedahan yang tak perlu, kenapa tidak?\n\n✅ Pindah lauk ke pinggan kaca/seramik sebelum panaskan\n✅ Tukar bekas yang dah retak, melengkung atau kusam\n✅ Biar lauk sejuk sikit sebelum masuk bekas plastik\n✅ Bila beli bekas baru, pertimbangkan kaca atau keluli\n\nMomyizz sekarang simpan satu mangkuk kaca di pejabat. Senang. 😊\n\nSumber: Hussain et al. (2023), FDA, WHO (2022).",
threads:["Bekal dalam bekas plastik, terus masuk microwave. Momyizz pun dulu buat tiap hari. 🍱","Kajian makmal 2023: panaskan bekas plastik dalam microwave lepaskan lebih banyak zarah mikro/nanoplastik.\n\nKesan pada manusia? Masih dikaji. FDA kata bukti risiko belum ditunjukkan.","Langkah paling senang: pindah ke mangkuk kaca dulu, baru panaskan.\n\nKorang guna bekas apa untuk bekal?"],
cta:"Simpan (save) post ni sebagai peringatan. Kongsi dengan rakan sepejabat yang selalu beratur depan microwave dengan korang. 😄",
hashtags:TAGS+" #Mikroplastik #BekalSihat #WanitaBekerja #TipsDapur #KurangPlastik"},

title:"Botol Air Masih Penuh Sampai Petang?",

 {l:"info",t:"Letih berpanjangan ada banyak punca. Jumpa doktor jika keletihan berterusan.",s:"Panduan umum"}
],
solution:"Cara mudah ingat minum:\n• Segelas air selepas setiap waktu solat, 5 waktu = 5 gelas\n• Botol bertanda masa (10 pg, 12 tgh, 3 ptg, 5 ptg)\n• Air kosong dulu, baru kopi atau teh\n• Tambah buah berair seperti tembikai dan oren\n• Simpan botol air di tempat yang nampak",
product:"eSpring Water Purifier, sebagai pilihan untuk keluarga yang mahu air minuman tapisan di rumah. JANGAN dakwa eSpring menyingkirkan mikroplastik.",
productFacts:"Tersenarai di amway.my sebagai \"eSpring Water Purifier\" (kod 122940M, semakan 11 Nov 2026).\nPERLU SEMAK sebelum post: teknologi penapisan, pensijilan dan senarai bahan cemar yang dikurangkan, daripada halaman produk atau risalah rasmi. Hanya sebut apa yang tertulis dalam spesifikasi rasmi.",
sources:["efsaW","mdg","popkin","amway"],
visual:"Botol air bertanda masa di atas meja kerja, sebelah laptop dan sejadah kecil yang dilipat. Tona sage dan krim.",
prompt:"Clear glass water bottle with handwritten time markers on a tidy work desk beside a laptop, folded small prayer mat in background, soft daylight, sage green and cream palette, minimalist, 4:5",
storyboard:[["0–3s","Botol penuh di atas meja. Jam di dinding menunjukkan 4.00 petang. Teks: \"Siapa sama?\""],["3–12s","Momyizz menguap di depan laptop."],["12–25s","Grafik: wanita dewasa ~2.0 L air sehari (termasuk daripada makanan). Sumber EFSA."],["25–42s","Tip: 1 gelas selepas setiap solat, botol bertanda masa, air kosong dulu."],["42–48s","Botol kosong pada petang. Teks: \"Minum dulu, baru kopi.\""]],
fb:"Pagi bawa botol 1 liter penuh semangat. 💪\nPetang balik… botol masih penuh. 🫠\n\nYang habis hari ni cuma secawan kopi dan teh ais waktu lunch.\n\nKalau korang pun macam ni, jom kira sikit.\n\nMenurut EFSA (badan keselamatan makanan Eropah), wanita dewasa perlukan lebih kurang 2.0 liter air sehari. Ini termasuk air daripada makanan. Garis Panduan Diet Malaysia pula galakkan kita minum air kosong secukupnya dan kurangkan minuman manis.\n\nAda kajian yang kaitkan kurang minum dengan fokus dan mood yang menurun. Tapi ingat, rasa letih ada banyak punca. Kalau berpanjangan, jumpa doktor ya.\n\nTip yang betul-betul berkesan untuk Momyizz:\n🕌 Segelas air lepas setiap waktu solat. 5 waktu, dah 5 gelas!\n⏰ Botol bertanda masa\n💧 Air kosong dulu, baru kopi\n🍉 Tambah buah berair: tembikai, oren\n\nDi rumah, keluarga Momyizz biasakan minum air tapisan supaya senang isi botol setiap pagi. Setiap keluarga ada pilihan masing-masing, yang penting kita betul-betul minum!\n\nSumber: EFSA (2010), KKM Garis Panduan Diet Malaysia.",
threads:["Pukul 4 petang. Botol air masih penuh. Yang habis cuma kopi. ☕\n\nSiapa geng ni?","Wanita dewasa perlukan ~2.0 liter air sehari (termasuk daripada makanan), menurut EFSA.\n\nTrick Momyizz: segelas air lepas setiap waktu solat. 5 waktu = 5 gelas.","Cabaran esok: habiskan satu botol sebelum pukul 3 petang.\n\nSiapa nak join? Komen \"JOIN\". 💧"],
cta:"Sertai #CabaranAirMomyizz 7 hari. Komen \"JOIN\" dan kongsi gambar botol air korang.",
hashtags:TAGS+" #MinumAir #CabaranAirMomyizz #GayaHidupSihat #WanitaBekerja #Hidrasi"},

{n:6,p:"bp",hookType:"Situasi harian",format:"Video pendek",
title:"Rutin Kulit 5 Minit Selepas Kerja",
audience:"Wanita bekerja dan ibu yang penat dan tiada masa untuk rutin panjang.",
problem:"Balik kerja penat, terus baring. Mekap dan sunscreen tak dibersihkan. Bangun pagi kulit rasa kusam, rasa bersalah.",
hook:"Penat sangat sampai tertidur dengan muka belum cuci? Jom buat versi 5 minit.",
story:"Pukul 10 malam. Anak baru tidur. Momyizz rebah atas katil, telefon di tangan.\n\n\"Cuci muka esok je la…\"\n\nEsok pagi, kulit rasa berminyak, ada jerawat kecil di dagu.\n\nRupanya kulit tak perlu rutin 10 langkah. Yang dia perlu: rutin ringkas yang kita betul-betul buat setiap hari.",
facts:[
 {l:"bukti",t:"AAD: cuci muka dengan pencuci yang lembut, guna hujung jari, bilas dengan air suam (bukan panas) dan tepuk kering dengan tuala lembut. Jangan gosok kuat.",s:"AAD"},
 {l:"bukti",t:"AAD: buang mekap sebelum tidur.",s:"AAD"},
 {l:"bukti",t:"AAD: guna pelembap untuk membantu mengekalkan kelembapan kulit, dan pelindung matahari spektrum luas SPF 30 atau lebih setiap hari.",s:"AAD"},
 {l:"info",t:"Rutin yang konsisten lebih penting daripada bilangan produk.",s:"Panduan umum"}
],
solution:"Rutin 5 minit:\nMALAM: buang mekap → cuci muka 60 saat → pelembap\nPAGI: cuci ringkas → pelembap → pelindung matahari\nTip: letak semua produk dalam satu bekas di sebelah sinki supaya senang dicapai.",
product:"ARTISTRY. Contohnya ARTISTRY Gel Cleanser sebagai pencuci dan pelembap ARTISTRY mengikut jenis kulit. Cadangkan ARTISTRY Skin Analysis untuk kenal jenis kulit dahulu.",
productFacts:"Tersenarai di amway.my: \"ARTISTRY Gel Cleanser - 125ml\" dan perkhidmatan \"ARTISTRY Skin Analysis Experience\" (semakan 11 Nov 2026).\nPERLU SEMAK sebelum post: ramuan, jenis kulit yang sesuai dan cara guna. Jangan buat dakwaan hasil seperti \"cerah dalam 7 hari\".",
sources:["aad","amway"],
visual:"Sinki bilik air minimalis dengan dulang kayu kecil: pencuci, pelembap, pelindung matahari, tuala lembut. Jam menunjukkan 10 malam.",
prompt:"Minimalist bathroom vanity at night, small wooden tray with three plain skincare bottles (cleanser, moisturizer, sunscreen), folded soft cream towel, warm dim light, beige and sage palette, calm self-care mood, 4:5",
storyboard:[["0–3s","Momyizz rebah atas katil. Teks: \"Cuci muka esok je la…\""],["3–8s","Teks: \"Kulit tak perlukan 10 langkah. Dia perlukan konsisten.\""],["8–30s","Demo masa nyata: buang mekap, cuci 60 saat, tepuk kering, pelembap."],["30–42s","Pagi: pelindung matahari. Teks: SPF 30+ spektrum luas (AAD)."],["42–50s","Dulang produk di sebelah sinki. Teks: \"5 minit untuk diri sendiri.\""]],
fb:"Pukul 10 malam. Anak baru lena. Momyizz rebah atas katil.\n\"Cuci muka esok je la…\" 😴\n\nEsok pagi? Kulit berminyak, jerawat kecil muncul di dagu.\n\nMomyizz dulu fikir penjagaan kulit kena panjang, banyak langkah, banyak produk. Rupanya yang paling penting ialah KONSISTEN.\n\nIni panduan asas daripada American Academy of Dermatology:\n🫧 Cuci muka dengan pencuci lembut, guna hujung jari, bilas air suam\n🧴 Lembapkan kulit selepas cuci\n☀️ Pelindung matahari spektrum luas SPF 30+ setiap pagi\n🌙 Buang mekap sebelum tidur\n\nRutin 5 minit Momyizz:\nMALAM: buang mekap → cuci 60 saat → pelembap\nPAGI: cuci ringkas → pelembap → sunscreen\n\nTip paling membantu: letak semua dalam satu dulang kecil sebelah sinki. Bila nampak, kita buat.\n\nMomyizz guna pencuci gel yang lembut dan pelembap ikut jenis kulit. Kalau tak pasti jenis kulit sendiri, buat skin analysis dulu sebelum beli apa-apa. Jangan beli ikut trend. 😉\n\nMalam ni, 5 minit untuk diri sendiri ya. 💚\n\nSumber: American Academy of Dermatology.",
threads:["Mengaku: siapa pernah tertidur tanpa cuci muka sebab terlalu penat? 🙋‍♀️","Kulit tak perlu 10 langkah. Asas daripada AAD: cuci lembut, lembapkan, sunscreen SPF 30+ setiap pagi.\n\nRutin Momyizz: 5 minit je.","Tip: letak semua produk dalam satu dulang sebelah sinki. Bila nampak, kita buat.\n\nRutin malam korang berapa langkah?"],
cta:"Komen jenis kulit korang (kering/berminyak/kombinasi/sensitif). Momyizz kongsi tip rutin asas yang sesuai.",
hashtags:TAGS+" #RutinKulit #SkincareMalaysia #SelfCareIbu #Artistry #PenjagaanKulit"},

{n:7,p:"mp",hookType:"Fakta mengejut",format:"Video pendek",
title:"Air Botol Plastik: Apa Kata Kajian 2024?",
audience:"Keluarga yang selalu beli air botol dan pekerja yang bergantung pada air botol.",
problem:"Beli air botol berkotak-kotak untuk rumah dan kereta. Ada yang tersimpan berminggu-minggu dalam bonet kereta yang panas.",
hook:"Air botol yang kita beli sebab nak \"selamat\"… pernah dengar kajian 2024 ni?",
story:"Hujung minggu, Momyizz beli dua kotak air botol. Satu untuk rumah, satu simpan dalam bonet untuk anak-anak.\n\nSeminggu kemudian, buka bonet. Panas macam ketuhar. Botol-botol air tu dah \"berjemur\" seminggu.\n\nMasa tu teringat satu tajuk berita: kajian jumpa ratusan ribu zarah plastik dalam seliter air botol. Betul ke? Dan apa maksudnya untuk kita?",
facts:[
 {l:"awal",t:"Qian et al. (2024, PNAS) menggunakan teknik mikroskop baharu dan mengesan purata kira-kira 240,000 zarah plastik seliter dalam sampel air botol daripada tiga jenama di Amerika Syarikat. Kira-kira 90% ialah nanoplastik.",s:"Qian 2024"},
 {l:"info",t:"Kajian ini melibatkan sampel terhad. Ia menunjukkan keupayaan mengesan zarah yang lebih kecil, bukan bukti bahawa air botol membahayakan kesihatan.",s:"Qian 2024"},
 {l:"belum",t:"WHO (2019): tiada bukti kukuh setakat ini bahawa mikroplastik dalam air minuman memudaratkan pada tahap semasa. WHO menggesa lebih banyak kajian dan kawalan pencemaran plastik.",s:"WHO 2019"},
 {l:"kajian",t:"Kesan suhu tinggi ke atas pelepasan zarah daripada botol plastik masih dikaji.",s:"WHO 2022"}
],
solution:"Langkah praktikal:\n• Bawa botol guna semula (kaca atau keluli) yang diisi dari rumah\n• Simpan air botol di tempat sejuk dan teduh, bukan dalam bonet panas\n• Jangan guna semula botol sekali guna berulang kali sampai rosak\n• Air paip yang dimasak atau ditapis boleh jadi pilihan harian, ikut kesesuaian kawasan",
product:"Tiada. Sengaja tiada produk dalam episod ini supaya mesej mikroplastik kekal neutral dan berasaskan fakta.",
productFacts:"Tidak berkaitan.",
sources:["qian","who19","who22"],
visual:"Bonet kereta terbuka di bawah matahari dengan kotak air botol. Potongan ke dapur: botol keluli diisi air di rumah.",
prompt:"Open car trunk under bright Malaysian midday sun with a pack of plastic water bottles, heat haze, then contrast scene of a stainless steel bottle being filled in a calm kitchen, sage and beige tones, 9:16",
storyboard:[["0–3s","Bonet kereta dibuka, kotak air botol panas. Teks: \"Dah seminggu dalam ni…\""],["3–14s","Teks: Kajian 2024: purata ~240,000 zarah plastik seliter, kebanyakannya nanoplastik. Label KAJIAN AWAL."],["14–24s","Momyizz: \"Tapi ini tak bermaksud air botol beracun. WHO kata bukti bahaya belum kukuh.\""],["24–40s","Demo: isi botol keluli di rumah, simpan air botol di tempat teduh."],["40–46s","Teks: \"Lebih tahu, lebih tenang.\""]],
fb:"Hujung minggu Momyizz beli dua kotak air botol. Satu kotak Momyizz simpan dalam bonet untuk anak-anak. 🚗\n\nSeminggu kemudian, buka bonet. Panas macam ketuhar!\n\nTerus teringat tajuk berita awal 2024: \"Ratusan ribu zarah plastik dalam seliter air botol.\"\n\nJom tengok fakta sebenar:\n\n🔬 Kajian Qian et al. (PNAS, Januari 2024) guna teknik mikroskop baharu. Mereka uji air botol daripada 3 jenama di Amerika Syarikat dan jumpa purata ~240,000 zarah plastik seliter. Kira-kira 90% ialah nanoplastik, iaitu zarah yang sangat kecil.\n\nTapi ada beberapa perkara penting:\n🔸 Ini kajian dengan sampel terhad\n🔸 Ia tunjuk kita kini MAMPU mengesan zarah lebih kecil, bukan bukti air botol berbahaya\n🔸 WHO kata setakat ini tiada bukti kukuh mikroplastik dalam air minuman memudaratkan pada tahap semasa\n\nJadi tak perlu takut minum air botol bila perlu. Tapi untuk kegunaan harian, Momyizz pilih:\n✅ Isi botol keluli/kaca dari rumah\n✅ Simpan air botol di tempat teduh, bukan dalam bonet\n✅ Tak guna semula botol sekali guna berulang kali\n\nLebih tahu, lebih tenang. 💚\n\nSumber: Qian et al., PNAS (2024); WHO (2019, 2022).",
threads:["Simpan air botol dalam bonet kereta seminggu. Pernah buat? 🚗☀️","Kajian PNAS 2024 jumpa purata ~240,000 zarah plastik seliter dalam sampel air botol (3 jenama, AS). Kebanyakannya nanoplastik.\n\nTapi kajian ini belum buktikan bahaya. WHO kata bukti risiko masih belum kukuh.","Yang Momyizz ubah: isi botol keluli dari rumah, dan simpan air botol di tempat teduh.\n\nLebih tahu, lebih tenang. Setuju?"],
cta:"Share kepada keluarga yang selalu simpan air botol dalam kereta. Komen \"SIRI\" untuk episod mikroplastik seterusnya.",
hashtags:TAGS+" #Mikroplastik #AirMinuman #FaktaBukanPanik #KeluargaSihat #MicroplasticAwareness"},

{n:8,p:"hw",hookType:"Mitos vs Fakta",format:"Carousel / Gambar",
title:"Vitamin C: Bukan Hanya Bila Selesema",
audience:"Ibu dan keluarga yang mahu faham asas vitamin C.",
problem:"Kita cuma ingat vitamin C bila anak demam atau musim selesema. Hari biasa, buah jarang ada dalam pinggan.",
hook:"Kenapa kita cuma ingat vitamin C bila dah selesema?",
story:"Setiap kali anak bersin, Momyizz terus potong oren. Setiap kali musim hujan, baru teringat nak beli buah.\n\nTapi bila Momyizz tengok semula pinggan keluarga minggu lepas, buah hampir tiada.\n\nRupanya vitamin C bukan \"ubat selesema\". Ia zat harian yang badan tak boleh hasilkan sendiri.",
facts:[
 {l:"bukti",t:"Badan manusia tidak boleh menghasilkan vitamin C sendiri. Ia perlu diperoleh daripada makanan setiap hari.",s:"NIH ODS"},
 {l:"bukti",t:"Vitamin C diperlukan untuk penghasilan kolagen, membantu penyerapan zat besi daripada sumber tumbuhan, dan menyokong fungsi sistem imun yang normal.",s:"NIH ODS"},
 {l:"bukti",t:"Cadangan harian NIH untuk dewasa: wanita 75 mg, lelaki 90 mg. Sumber tempatan yang baik: jambu batu, betik, oren, brokoli dan cili benggala.",s:"NIH ODS"},
 {l:"belum",t:"Bagi kebanyakan orang, pengambilan vitamin C secara rutin tidak terbukti mencegah selesema. Ia mungkin memendekkan sedikit tempoh selesema bagi sesetengah orang.",s:"Cochrane 2013"}
],
solution:"• Satu hidangan buah tinggi vitamin C setiap hari\n• Potong jambu batu atau betik dan simpan dalam peti, senang anak capai\n• Makan buah bersama hidangan sayur hijau atau kekacang untuk bantu penyerapan zat besi\n• Pelbagaikan warna buah dan sayur dalam seminggu",
product:"Nutrilite Bio C Plus. Pelengkap bagi yang sukar mendapat buah secukupnya. Tegaskan makanan tetap sumber utama.",
productFacts:"Tersenarai di amway.my sebagai \"Nutrilite Bio C Plus All Day Formula\" (semakan 11 Nov 2026).\nPERLU SEMAK sebelum post: kandungan vitamin C (mg) setiap tablet, ramuan dan dos pada label rasmi. Jangan dakwa ia mencegah atau merawat penyakit.",
sources:["vitc","cochrane","amway"],
visual:"Carousel 6 slaid: (1) Hook, (2) Mitos vs Fakta, (3) Fungsi vitamin C, (4) Keperluan harian, (5) Buah tempatan tinggi vitamin C, (6) CTA. Latar krim, ilustrasi buah garis halus.",
prompt:"Flat lay of Malaysian fruits rich in vitamin C, sliced guava, papaya, orange halves, broccoli florets and red bell pepper on cream linen, soft daylight, minimalist, sage accents, clean space for carousel text, 1:1",
storyboard:[["Slaid 1","\"Kenapa kita cuma ingat vitamin C bila dah selesema?\""],["Slaid 2","MITOS: Vitamin C hanya untuk selesema. FAKTA: Ia zat harian yang badan tak boleh hasilkan."],["Slaid 3","3 fungsi: kolagen, penyerapan zat besi, sistem imun normal."],["Slaid 4","Wanita 75 mg, lelaki 90 mg sehari (NIH)."],["Slaid 5","Buah tempatan: jambu batu, betik, oren, brokoli, cili benggala."],["Slaid 6","\"1 hidangan buah setiap hari. Save untuk ingat!\""]],
fb:"Setiap kali anak bersin, Momyizz terus potong oren. 🍊\nSetiap kali musim hujan, baru teringat nak beli buah.\n\nTapi bila Momyizz tengok semula menu minggu lepas… buah hampir tak ada langsung. 😅\n\nRupanya vitamin C bukan \"ubat selesema\".\n\n📌 Badan kita TAK BOLEH hasilkan vitamin C sendiri. Kena dapat daripada makanan setiap hari.\n📌 Vitamin C diperlukan untuk penghasilan kolagen, membantu penyerapan zat besi daripada sayur dan kekacang, serta menyokong fungsi sistem imun yang normal.\n📌 Cadangan harian (NIH): wanita 75 mg, lelaki 90 mg.\n\nMitos yang perlu kita betulkan: kajian Cochrane dapati, bagi kebanyakan orang, ambil vitamin C secara rutin TIDAK terbukti mencegah selesema. Mungkin ia pendekkan sedikit tempoh selesema bagi sesetengah orang. Jadi makan buah setiap hari, bukan bila dah sakit sahaja.\n\nBuah tempatan yang tinggi vitamin C:\n🍈 Jambu batu\n🧡 Betik\n🍊 Oren\n🥦 Brokoli\n🫑 Cili benggala\n\nTip Momyizz: potong jambu atau betik awal-awal, simpan dalam bekas kaca dalam peti. Anak-anak senang capai.\n\nBagi yang memang sukar dapat buah secukupnya, ada yang ambil suplemen sebagai pelengkap. Tapi buah dan sayur tetap nombor satu.\n\nSumber: NIH Office of Dietary Supplements; Cochrane Review (2013).",
threads:["Mitos: vitamin C cuma perlu bila selesema.\n\nFakta: badan kita langsung tak boleh hasilkan vitamin C. Kena dapat daripada makanan SETIAP hari. 🍊","Ia perlu untuk penghasilan kolagen, penyerapan zat besi dan fungsi imun yang normal.\n\nDan kajian Cochrane: vitamin C rutin tak terbukti mencegah selesema bagi kebanyakan orang.","Jambu batu antara buah tempatan yang tinggi vitamin C. Murah dan senang dapat.\n\nBuah apa paling selalu ada di rumah korang?"],
cta:"Save carousel ni dan tag pasangan yang selalu lupa makan buah. 🍈",
hashtags:TAGS+" #VitaminC #NutrisiKeluarga #MitosVsFakta #BuahTempatan #Nutrilite"},

{n:9,p:"lf",hookType:"Soalan",format:"Video pendek",
title:"Duduk 9 Jam Sehari? Gerak 10 Minit Pun Dikira",
audience:"Wanita bekerja di pejabat dan ibu di rumah yang tiada masa untuk bersenam.",
problem:"Duduk depan laptop, duduk dalam kereta, duduk depan TV. Nak ke gym memang tak sempat, jadi terus tak bergerak langsung.",
hook:"Kalau dikira, berapa jam korang duduk hari ni?",
story:"Momyizz cuba kira satu hari biasa: 1 jam dalam kereta, 7 jam depan laptop, 1 jam depan TV lepas anak tidur.\n\nSembilan jam duduk.\n\n\"Nak bersenam? Bila masa?\"\n\nRupanya WHO sendiri kata: setiap pergerakan dikira. Tak perlu terus jadi atlet. Mulakan dengan 10 minit.",
facts:[
 {l:"bukti",t:"WHO (2020): dewasa digalakkan melakukan 150–300 minit aktiviti fizikal sederhana seminggu (atau 75–150 minit aktiviti berat), serta latihan menguatkan otot sekurang-kurangnya 2 hari seminggu.",s:"WHO 2020"},
 {l:"bukti",t:"WHO (2020): sedikit aktiviti lebih baik daripada tiada langsung. Kurangkan masa duduk dan gantikan dengan aktiviti fizikal pada sebarang intensiti.",s:"WHO 2020"},
 {l:"bukti",t:"Garis panduan WHO 2020 juga menggalakkan aktiviti fizikal untuk wanita semasa dan selepas mengandung, dengan nasihat doktor.",s:"WHO 2020"}
],
solution:"Gerak tanpa gym:\n• Jalan 10 minit selepas makan malam (bawa anak sekali)\n• Berdiri atau berjalan bila jawab panggilan telefon\n• Peringatan \"gerak\" setiap jam di telefon\n• Naik tangga, parkir jauh sedikit\n• 15 minit main kejar-kejar dengan anak di taman\n• Senaman ringkas menguatkan otot 2 kali seminggu: squat, tekan tubi dinding",
product:"Tiada. Episod people-first sepenuhnya. Simpan topik kesihatan tulang dan Cal Mag D Plus untuk kitaran seterusnya.",
productFacts:"Tidak berkaitan.",
sources:["whoPA"],
visual:"Kiraan jam duduk muncul atas skrin (kereta, laptop, sofa). Kemudian montaj gerak kecil: tangga, jalan petang dengan anak.",
prompt:"Malaysian working mother walking with her young child in a quiet neighborhood park at golden hour, relaxed and happy, soft natural tones of sage and warm beige, candid lifestyle photo, 9:16",

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const HARI=["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
const BULAN=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d,withDay){return (withDay?HARI[d.getDay()]+", ":"")+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear()}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function dayIdx(){return Math.round((today0()-parseD(state.startDate))/864e5)}
function epDate(e){return addDays(parseD(state.startDate),(e.n-1)*3)}
function epDone(e){return CHECK.filter(c=>e.checks[c[0]]).length}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2200)}
function stCls(s){return "st"+Math.max(0,STATUS.indexOf(s))}
function pct(a,b){return b?Math.round(a/b*100):0}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast("Disalin")}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Disalin")}catch(_){toast("Tekan lama untuk salin")}ta.remove()}
}

const LS="momyizz-planner-v1";
let state=null, mode="local", dbRef=null, writing=false, pending=false, timer=null;
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.episodes)return o}}catch(e){}return null}
function setSave(s,txt){const el=$("#saveState");el.dataset.s=s;el.querySelector("span").textContent=txt}
function save(){
  state.savedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(dbRef){setSave("saving","Menyimpan…");clearTimeout(timer);timer=setTimeout(pushCloud,900)}
  else setSave("local","Disimpan di peranti");
  gdSchedule();
}
async function pushCloud(){
  if(!dbRef)return;
  if(writing){pending=true;return}
  writing=true;
  try{await dbRef.set({json:JSON.stringify(state),savedAt:state.savedAt});setSave("cloud","Disimpan di akaun")}
  catch(e){setSave("local","Disimpan di peranti sahaja")}
  writing=false;
  if(pending){pending=false;pushCloud()}
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=="function"){setSave("local","Disimpan di peranti");return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){setSave("local","Disimpan di peranti");return}
    const id=await user.id();
    if(!id){setSave("local","Disimpan di peranti");return}
    const ref=db.doc("data/users/"+id+"/planner/main");
    const snap=await Promise.race([ref.get(),new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),10000))]);
    dbRef=ref;mode="cloud";
    if(snap.exists){
      const d=snap.data();let remote=null;try{remote=JSON.parse(d.json)}catch(e){}
      if(remote&&remote.episodes&&(remote.savedAt||0)>(state.savedAt||0)){state=remote;try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){};render()}
      else if((state.savedAt||0)>(remote?.savedAt||0)) pushCloud();
    }else if(state.savedAt){pushCloud()}
    setSave("cloud","Disimpan di akaun");
  }catch(e){setSave("local","Disimpan di peranti")}
}

/* ================= GOOGLE DRIVE (Apps Script) ================= */
const APPS_SCRIPT="/* MOMYIZZ - Backup automatik ke Google Drive\n   1. Tukar KATA_RAHSIA di bawah kepada kata rahsia anda sendiri.\n   2. Deploy > New deployment > Web app > Execute as: Me > Who has access: Anyone.\n   3. Salin \"Web app URL\" dan tampal dalam worksheet (Backup > Google Drive). */\nconst KATA_RAHSIA = 'TUKAR_KATA_RAHSIA_INI';\nconst NAMA_FOLDER = 'Momyizz Backup';\nconst SIMPAN_MAKSIMUM = 60; // bilangan fail backup harian yang disimpan\n\nfunction folder_() {\n  const it = DriveApp.getFoldersByName(NAMA_FOLDER);\n  return it.hasNext() ? it.next() : DriveApp.createFolder(NAMA_FOLDER);\n}\nfunction balas_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction senaraiFail_(folder) {\n  const out = [];\n  const it = folder.getFiles();\n  while (it.hasNext()) {\n    const f = it.next();\n    if (/^momyizz-backup-\\d{4}-\\d{2}-\\d{2}\\.json$/.test(f.getName())) out.push(f);\n  }\n  out.sort(function (a, b) { return b.getName() < a.getName() ? -1 : 1; });\n  return out;\n}\nfunction doGet() {\n  return balas_({ ok: true, info: 'Skrip backup Momyizz aktif.' });\n}\nfunction doPost(e) {\n  const lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(20000);\n    const body = JSON.parse(e.postData.contents);\n    if (KATA_RAHSIA === 'TUKAR_KATA_RAHSIA_INI') return balas_({ ok: false, error: 'Tukar KATA_RAHSIA dalam skrip dahulu.' });\n    if (body.key !== KATA_RAHSIA) return balas_({ ok: false, error: 'Kata rahsia tidak sepadan.' });\n    const folder = folder_();\n    if (body.action === 'ping') return balas_({ ok: true, folder: NAMA_FOLDER });\n    if (body.action === 'save') {\n      const hari = Utilities.formatDate(new Date(), 'Asia/Kuala_Lumpur', 'yyyy-MM-dd');\n      const nama = 'momyizz-backup-' + hari + '.json';\n      const isi = JSON.stringify(body.data);\n      const ada = folder.getFilesByName(nama);\n      if (ada.hasNext()) ada.next().setContent(isi);\n      else folder.createFile(nama, isi, MimeType.PLAIN_TEXT);\n      senaraiFail_(folder).slice(SIMPAN_MAKSIMUM).forEach(function (f) { f.setTrashed(true); });\n      return balas_({ ok: true, file: nama });\n    }\n    if (body.action === 'latest') {\n      const fail = senaraiFail_(folder);\n      if (!fail.length) return balas_({ ok: false, error: 'Tiada fail backup dalam folder ' + NAMA_FOLDER + '.' });\n      return balas_({ ok: true, file: fail[0].getName(), data: JSON.parse(fail[0].getBlob().getDataAsString()) });\n    }\n    return balas_({ ok: false, error: 'Tindakan tidak dikenali.' });\n  } catch (err) {\n    return balas_({ ok: false, error: String(err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n";
const GDK="momyizz-gdrive";
let gd=(()=>{try{return JSON.parse(localStorage.getItem(GDK))||{}}catch(e){return {}}})();
let gdTimer=null, gdBusy=false, gdAgain=false, gdRestoreBuf=null;
function gdOn(){return !!(gd.url&&gd.key)}
function gdStore(){try{localStorage.setItem(GDK,JSON.stringify(gd))}catch(e){}}
function gdStatusText(){
  if(!gdOn())return "Belum disambung";
  if(gd.err)return "Ralat: "+gd.err;
  if(gdBusy)return "Menghantar backup ke Drive…";
  if(gd.last)return "Backup terakhir: "+new Date(gd.last).toLocaleString("ms-MY")+(gd.file?" ("+gd.file+")":"");
  return "Disambung. Backup pertama akan dihantar selepas perubahan seterusnya.";
}
function gdPaint(){const el=document.getElementById("gdStatus");if(el){el.textContent=gdStatusText();el.style.color=gd.err?"var(--bad)":"inherit"}}
async function gdCall(body){
  const r=await fetch(gd.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key:gd.key}),redirect:"follow"});
  let o=null;try{o=await r.json()}catch(e){throw new Error("Jawapan tidak sah. Semak URL Web app dan akses 'Anyone'.")}
  if(!o.ok)throw new Error(o.error||"Gagal");
  return o;
}
function gdSchedule(){if(!gdOn())return;clearTimeout(gdTimer);gdTimer=setTimeout(gdPush,8000)}
async function gdPush(){
  if(!gdOn())return;
  clearTimeout(gdTimer);gdTimer=null;
  if(gdBusy){gdAgain=true;return}
  gdBusy=true;gdPaint();
  const at=state.savedAt;
  try{const o=await gdCall({action:"save",data:state});gd.last=Date.now();gd.savedAt=at;gd.file=o.file;gd.err=""}
  catch(e){gd.err=e.message||"Tiada sambungan internet"}
  gdBusy=false;gdStore();gdPaint();
  if(gdAgain){gdAgain=false;gdPush()}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&gdTimer)gdPush()});
window.addEventListener("online",()=>{if(gdOn()&&(state.savedAt||0)>(gd.savedAt||0))gdPush()});

function rem(){if(!state.rem||!Array.isArray(state.rem.times))state.rem={times:["08:30","12:30","20:30"],done:{}};state.rem.done=state.rem.done||{};return state.rem}
function remToday(){const r=rem(),k=iso(today0());return r.done[k]||[false,false,false]}
function remAt(t){const [h,m]=t.split(":").map(Number);const d=today0();d.setHours(h,m,0,0);return d}
function remLate(i){return !remToday()[i]&&new Date()>=remAt(rem().times[i])}
function remSlotsHtml(){

function gcalLink(i){

function remIcs(){
  const r=rem(),pad=n=>String(n).padStart(2,"0"),now=new Date();
  const utc=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Momyizz//Planner//MS","CALSCALE:GREGORIAN"];
  r.times.forEach((t,i)=>{const st=addDays(remAt(t),1),en=new Date(st.getTime()+15*6e4);
    L.push("BEGIN:VEVENT","UID:momyizz-video-"+(i+1)+"-"+now.getTime()+"@planner","DTSTAMP:"+utc(now),"DTSTART:"+utc(st),"DTEND:"+utc(en),"RRULE:FREQ=DAILY",
      "SUMMARY:Momyizz: "+REM_LBL[i],"DESCRIPTION:Masa untuk "+REM_LBL[i].toLowerCase()+" (3 video sehari).",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Momyizz: "+REM_LBL[i],"TRIGGER:PT0M","END:VALARM","END:VEVENT")});
  L.push("END:VCALENDAR");return L.join("\r\n")+"\r\n";
}

function remTick(){

function metrics(){
  const eps=state.episodes, ti=dayIdx();
  const done=eps.filter(e=>e.status==="SUDAH POST").length;
  let posted=0,late=0;
  eps.forEach(e=>{POSTKEYS.forEach(k=>{if(e.checks[k])posted++;else if((e.n-1)*3<ti)late++})});
  const totalChecks=eps.length*CHECK.length, ticked=eps.reduce((a,e)=>a+epDone(e),0);
  let dailyDone=0;for(let i=0;i<30;i++){const d=state.daily[i];if(d&&DAILY.every(t=>d.tasks?.[t[0]]))dailyDone++}
  return {done,posted,late,ticked,totalChecks,overall:pct(ticked,totalChecks),dailyDone};
}
function nextEp(){
  const ti=dayIdx();
  return state.episodes.find(e=>e.status!=="SUDAH POST"&&(e.n-1)*3>=ti)||state.episodes.find(e=>e.status!=="SUDAH POST")||null;
}
function perfTotals(){
  const t={views:0,reach:0,likes:0,comments:0,shares:0,saves:0,inq:0,leads:0};
  state.perf.forEach(p=>Object.keys(t).forEach(k=>t[k]+=Number(p[k])||0));return t;
}

/* ================= PAPARAN: HARIAN ================= */
function vHarian(){

  const days=[];
  for(let i=0;i<30;i++){
    const d=addDays(start,i), pl=dayPlan(i), dd=state.daily[i]||{}, n=DAILY.filter(t=>dd.tasks?.[t[0]]).length;
    const open= openDay===i || (openDay===null&&i===ti);
    days.push(`<details class="dd ${i===ti?"today":""}" ${open?"open":""} id="day-${i}" data-dayd="${i}">
      <summary><span class="dn num">${i+1}<small>${HARI[d.getDay()].slice(0,3)} ${d.getDate()} ${BULAN[d.getMonth()]}</small></span>

      <span class="ring num ${n===8?"done":""}">${n}/8</span></summary>
      <div class="fbody">
        <div>${DAILY.map(t=>`<label class="chk"><input type="checkbox" data-dchk="${i}:${t[0]}" id="d-${i}-${t[0]}" ${dd.tasks?.[t[0]]?"checked":""}><span>${t[1]}</span></label>`).join("")}</div>
        ${pl.ep?`<button class="btn ghost sm" type="button" data-ep="${pl.ep.n}" style="align-self:flex-start">Buka Ep ${pl.ep.n}</button>`:""}
        <label class="lb">Catatan perkembangan<textarea data-dnote="${i}" id="dn-${i}" placeholder="Apa yang berjaya hari ini? Soalan audiens? Idea baharu?">${esc(dd.note||"")}</textarea></label>

  return `<section class="view">
  <div><div class="eyebrow">Daily Activity Tracker</div><h1 style="font-size:22px">Aktiviti Harian 30 Hari</h1></div>

    <div class="bar big"><i style="width:${pct(ticks,240)}%"></i></div>
    <div style="display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px" aria-hidden="true">${Array.from({length:30},(_,i)=>{const n=DAILY.filter(t=>state.daily[i]?.tasks?.[t[0]]).length;return `<span style="height:14px;border-radius:3px;background:${n===8?"var(--sage-deep)":n?"var(--sage)":"var(--linen)"};opacity:${n&&n<8?.45+n/16:1};outline:${i===ti?"2px solid var(--wood)":"none"}"></span>`}).join("")}</div>

/* ================= PAPARAN: PRESTASI ================= */
function eng(p){return (+p.likes||0)+(+p.comments||0)+(+p.shares||0)+(+p.saves||0)}
function group(key){
  const m={};state.perf.forEach(p=>{const k=p[key]||"—";m[k]=m[k]||{eng:0,views:0,n:0};m[k].eng+=eng(p);m[k].views+=+p.views||0;m[k].n++});
  return Object.entries(m).sort((a,b)=>b[1].eng-a[1].eng);
}
function bars(rows){const max=Math.max(1,...rows.map(r=>r[1].eng));return rows.slice(0,6).map(r=>`<div class="hbar"><span class="lbl" title="${esc(r[0])}">${esc(r[0])}</span><div class="bar"><i style="width:${pct(r[1].eng,max)}%"></i></div><span class="v num">${r[1].eng.toLocaleString("ms-MY")}</span></div>`).join("")}

    const alt=f=>({"Video pendek":"carousel 'Mitos vs Fakta' dan thread soalan","Carousel / Gambar":"video 30 saat dengan cerita peribadi","Teks / Thread":"video pendek atau carousel ringkas","Live":"potongan klip 30 saat untuk TikTok","Story":"post carousel kekal"}[f]||"format berbeza");
    analysis=`<div class="card"><b>Analisis</b>

        <div class="stat"><span>Topik paling popular</span><b style="font-size:15px">${esc(byT[0][0])}</b></div>

      </div></div>

      <div class="card"><b>Idea yang boleh diulang dalam bentuk berbeza</b><ul class="tasks" style="margin-top:6px">${ranked.map(r=>`<li><div><b>${esc(r.p.title)}</b><div class="small muted">Kadar engagement ${(r.rate*100).toFixed(1)}% di ${esc(r.p.platform)} (${esc(r.p.format)}). Cuba ulang sebagai ${alt(r.p.format)}.</div></div></li>`).join("")}</ul></div>`;

}

/* ================= RENDER ================= */
const VOICE_KEYS=["title","audience","problem","hook","story","solution","product","productFacts","visual","fb","cta","hashtags","notes"];
function voiceFix(t){return typeof t!=="string"?t:t.replace(/(^|[^A-Za-z])[Ss]aya(?![A-Za-z])/g,"$1Momyizz").replace(/(^|[^A-Za-z])awak(?![A-Za-z])/g,"$1korang").replace(/(^|[^A-Za-z])Awak(?![A-Za-z])/g,"$1Korang").replace("bertahun Momyizz guna","bertahun dipakai")}
function migrateVoice(){
  if(!state||state.voiceV2||!Array.isArray(state.episodes))return;
  state.episodes.forEach(e=>{VOICE_KEYS.forEach(k=>{if(typeof e[k]==="string")e[k]=voiceFix(e[k])});
    if(Array.isArray(e.threads))e.threads=e.threads.map(voiceFix);
    if(Array.isArray(e.storyboard))e.storyboard=e.storyboard.map(x=>Array.isArray(x)?x.map(voiceFix):x);
    if(Array.isArray(e.facts))e.facts=e.facts.map(f=>f&&typeof f==="object"?{...f,t:voiceFix(f.t)}:f)});
  state.voiceV2=true;save();
}
function render(){
  migrateVoice();
  renderTabs();
  let h="";
  if(view==="utama")h=vUtama();
  else if(view==="kalendar")h=vKalendar();
  else if(view==="episod")h=openEp?vEpisodDetail(state.episodes[openEp-1]):vEpisodList();
  else if(view==="harian")h=vHarian();
  else if(view==="prestasi")h=vPrestasi();
  else if(view==="idea")h=vIdea();
  else if(view==="backup")h=vBackup();
  else if(view==="peringatan")h=vPeringatan();
  $("#app").innerHTML=h;
  if(view==="harian"&&openDay!==null){const el=document.getElementById("day-"+openDay);if(el)el.scrollIntoView({block:"start"});openDay=null}
}
function curEp(){return openEp?state.episodes[openEp-1]:null}
function autoStatus(e){
  const prod=CHECK.slice(0,8).every(c=>e.checks[c[0]]), anyPost=POSTKEYS.some(k=>e.checks[k]), allPost=POSTKEYS.every(k=>e.checks[k]), any=CHECK.some(c=>e.checks[c[0]]);
  if(allPost)e.status="SUDAH POST";
  else if(prod&&!anyPost)e.status="SIAP UNTUK POST";
  else if(any&&e.status==="BELUM MULA")e.status="DALAM PROSES";
  if(allPost&&!e.postDate)e.postDate=iso(today0());
}

/* ================= EVENTS ================= */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const ds=b.dataset;
  if(b.id==="openBackup"||b.id==="openBackup2"){go("backup");return}
  if(ds.epn){go("episod",{ep:+ds.epn});return}
  if(ds.go){go(ds.go,ds.day!==undefined?{day:+ds.day}:undefined);return}
  if(ds.ep){editMode=false;go("episod",{ep:+ds.ep});return}
  if(ds.back){openEp=null;editMode=false;render();window.scrollTo(0,0);return}
  if(ds.nav){const n=+ds.nav;if(n>=1&&n<=10){editMode=false;go("episod",{ep:n})}return}
  if(ds.cancel){confirmKey=null;render();return}
  if(b.id==="remNotif"){try{await Notification.requestPermission()}catch(_){}render();return}
  if(b.id==="remIcs"){
    const txt=remIcs(),fname="momyizz-peringatan-3-video.ics";let saved=false;
    try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;if(dl){await dl.save({filename:fname,data:txt,mimeType:"text/calendar"});saved=true;toast("Fail kalendar disimpan. Buka fail itu untuk tambah alarm.")}}catch(err){if(err&&err.code==="declined"){toast("Muat turun dibatalkan");return}}
    if(!saved){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("Buka fail .ics yang dimuat turun")}catch(_){toast("Muat turun gagal. Guna butang Google Calendar atau app Jam.")}}
    return}
  if(b.id==="toggleEdit"){editMode=!editMode;render();return}
  const e=curEp();
  if(ds.status&&e){e.status=ds.status;if(ds.status==="SUDAH POST"&&!e.postDate)e.postDate=iso(today0());save();render();toast("Status: "+ds.status);return}
  if(ds.copy&&e){copyText(e[ds.copy]);return}
  if(ds.copypack&&e){copyText(packText(e,ds.copypack));return}
  if(ds.copyth&&e){copyText(ds.copyth==="all"?e.threads.join("\n\n"):e.threads[+ds.copyth]);return}
  if(b.id==="resetEp"){confirmKey="resetEp";render();return}
  if(b.id==="resetEpYes"&&e){const s=SEED_EPISODES[e.n-1];Object.assign(e,JSON.parse(JSON.stringify(s)));confirmKey=null;save();render();toast("Teks asal dipulihkan");return}
  // perf
  if(ds.pdel){confirmKey="del:"+ds.pdel;render();return}
  if(ds.pdelyes){state.perf=state.perf.filter(p=>p.id!==ds.pdelyes);confirmKey=null;save();render();toast("Rekod dipadam");return}
  // ideas
  if(ds.ifilter){ideaFilter=ds.ifilter;render();return}
  if(ds.iused){const i=state.ideas.find(x=>x.id===ds.iused);if(i){i.used=!i.used;save();render()}return}
  if(ds.idel){confirmKey="idel:"+ds.idel;render();return}
  if(ds.idelyes){state.ideas=state.ideas.filter(x=>x.id!==ds.idelyes);confirmKey=null;save();render();toast("Idea dipadam");return}
  // backup
  if(b.id==="exFile"||b.id==="exCopy"){
    const txt=JSON.stringify(state,null,1), fname="momyizz-backup-"+iso(today0())+".json";
    const ta=$("#exText");ta.value=txt;ta.hidden=false;
    if(b.id==="exCopy"){copyText(txt);return}
    let saved=false;
    try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;if(dl){await dl.save({filename:fname,data:txt});saved=true;toast("Backup disimpan")}}catch(err){if(err&&err.code==="declined"){toast("Muat turun dibatalkan");return}}
    if(!saved){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("Jika fail tidak dimuat turun, salin teks di bawah")}catch(_){toast("Salin teks di bawah sebagai backup")}}
    return}
  if(b.id==="imGo"){const t=$("#imText").value.trim();if(!t){toast("Pilih fail atau tampal teks backup dahulu");return}try{const o=JSON.parse(t);if(!o.episodes||!Array.isArray(o.episodes))throw 0;importBuf=o;confirmKey="import";render();$("#imText").value=t}catch(_){toast("Teks backup tidak sah. Pastikan disalin sepenuhnya.")}return}
  if(b.id==="imYes"&&importBuf){state=importBuf;importBuf=null;confirmKey=null;save();go("utama");toast("Backup diimport");return}
  if(b.id==="cycleGo"){confirmKey="cycle";render();return}
  if(b.id==="cycleYes"){state.startDate=iso(addDays(parseD(state.startDate),30));state.episodes.forEach(x=>{x.checks={};x.status=STATUS[0];x.postDate="";x.links={fb:"",threads:"",tiktok:"",ig:""};x.notes=""});state.daily={};confirmKey=null;save();go("utama");toast("Kitaran baharu bermula "+fmt(parseD(state.startDate)));return}
  if(b.id==="resetGo"){confirmKey="reset";render();return}
  if(b.id==="gdCopy"){copyText(APPS_SCRIPT);return}
  if(b.id==="gdConnect"){
    const url=$("#gdUrl").value.trim(), key=$("#gdKey").value.trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){toast("URL mesti bermula dengan https://script.google.com/macros/s/ dan berakhir dengan /exec");return}
    if(!key){toast("Masukkan kata rahsia");return}
    b.disabled=true;b.textContent="Menguji…";
    const prev={...gd};gd={url,key};
    try{await gdCall({action:"ping"});gdStore();toast("Google Drive disambung");await gdPush();render()}
    catch(err){gd=prev;b.disabled=false;b.textContent="Sambung & uji";toast("Gagal: "+(err.message||"tiada sambungan"))}
    return}
  if(b.id==="gdNow"){await gdPush();toast(gd.err?"Backup gagal":"Backup dihantar ke Drive");return}
  if(b.id==="gdRestore"){b.disabled=true;try{const o=await gdCall({action:"latest"});if(!o.data||!Array.isArray(o.data.episodes))throw new Error("Fail backup tidak sah");gdRestoreBuf=o;confirmKey="gdrestore";render()}catch(err){b.disabled=false;toast("Gagal: "+(err.message||"tiada sambungan"))}return}
  if(b.id==="gdRestoreYes"&&gdRestoreBuf){state=gdRestoreBuf.data;gdRestoreBuf=null;confirmKey=null;try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}if(dbRef)pushCloud();go("utama");toast("Data dipulihkan dari Google Drive");return}
  if(b.id==="gdOff"){gd={};gdStore();render();toast("Sambungan Drive diputuskan");return}
  if(b.id==="resetYes"){state=seedState();confirmKey=null;save();go("utama");toast("Template asal dipulihkan");return}
});
let importBuf=null;
document.addEventListener("change",ev=>{
  const t=ev.target, e=curEp();
  if(t.dataset.chk&&e){e.checks[t.dataset.chk]=t.checked;autoStatus(e);save();render();return}
  if(t.dataset.dchk){const [i,k]=t.dataset.dchk.split(":");state.daily[i]=state.daily[i]||{tasks:{},note:""};state.daily[i].tasks=state.daily[i].tasks||{};state.daily[i].tasks[k]=t.checked;save();openDay=+i;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(t.dataset.rchk!==undefined){const r=rem(),k=iso(today0()),a=(r.done[k]||[false,false,false]).slice();a[+t.dataset.rchk]=t.checked;r.done={[k]:a};save();render();if(t.checked)toast(a.every(Boolean)?"3/3 video siap hari ini. Syabas!":"Ditanda siap");return}
  if(t.dataset.rtime!==undefined&&/^\d{2}:\d{2}$/.test(t.value)){rem().times[+t.dataset.rtime]=t.value;save();render();toast("Masa dikemas kini. Tambah semula ke kalendar.");return}
  if(t.id==="startDate"&&t.value){state.startDate=t.value;save();toast("Tarikh mula: "+fmt(parseD(t.value)));return}
  if(t.id==="imFile"&&t.files[0]){const r=new FileReader();r.onload=()=>{$("#imText").value=r.result;toast("Fail dimuatkan. Tekan Import.")};r.readAsText(t.files[0]);return}
  if(t.tagName==="SELECT"&&t.dataset.f&&e){e[t.dataset.f]=t.value;save();render();return}
  if(t.id==="pf-title"){const m=t.value.match(/^Ep (\d+):/);if(m){const ep=state.episodes[+m[1]-1];$("#pf-format").value=ep.format;$("#pf-hook").value=ep.hookType}}
});
document.addEventListener("input",ev=>{
  const t=ev.target, e=curEp();
  if(e){
    if(t.dataset.f&&t.tagName!=="SELECT"){e[t.dataset.f]=t.value;save();return}
    if(t.dataset.link){e.links[t.dataset.link]=t.value;save();return}
    if(t.dataset.facts){e.facts=t.value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^\[(\w+)\]\s*(.*)$/);let l="info",tx=s;if(m&&EVL[m[1]]){l=m[1];tx=m[2]}let src="";const sm=tx.match(/\(([^()]*)\)\s*$/);if(sm){src=sm[1];tx=tx.slice(0,sm.index).trim()}return {l,t:tx,s:src}});save();return}
    if(t.dataset.sb){e.storyboard=t.value.split("\n").filter(s=>s.trim()).map(s=>{const i=s.indexOf("|");return i>-1?[s.slice(0,i).trim(),s.slice(i+1).trim()]:["",s.trim()]});save();return}
    if(t.dataset.th){e.threads=t.value.split(/\n-{3,}\n/).map(s=>s.trim()).filter(Boolean);save();return}
  }
  if(t.dataset.dnote!==undefined){const i=t.dataset.dnote;state.daily[i]=state.daily[i]||{tasks:{},note:""};state.daily[i].note=t.value;save();return}
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="perfForm"){
    const g=id=>$("#pf-"+id).value;
    const title=g("title").replace(/^Ep \d+:\s*/,"");
    state.perf.push({id:uid(),title,date:g("date"),platform:g("platform"),format:g("format"),hook:g("hook"),views:+g("views")||0,reach:+g("reach")||0,likes:+g("likes")||0,comments:+g("comments")||0,shares:+g("shares")||0,saves:+g("saves")||0,inq:+g("inq")||0,leads:+g("leads")||0});
    save();render();toast("Rekod prestasi disimpan");
  }
  if(ev.target.id==="ideaForm"){
    const text=$("#if-text").value.trim();if(!text){toast("Tulis idea dahulu");return}
    state.ideas.unshift({id:uid(),cat:$("#if-cat").value,text,used:false,added:iso(today0())});save();render();toast("Idea disimpan");
  }
});

/* ================= BOOT ================= */
state=loadLocal()||seedState();
setSave("local","Disimpan di peranti");
{const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h)||h==="backup"||h==="peringatan")view=h}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!==view&&(TABS.some(t=>t[0]===h)||h==="backup"||h==="peringatan")){view=h;openEp=null;render()}});
render();
initCloud();
remTick();setInterval(remTick,30000);
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(gdOn()&&(state.savedAt||0)>(gd.savedAt||0))gdSchedule();
</script>
